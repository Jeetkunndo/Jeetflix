name: Filtrar lista M3U

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # <--- LÍNEA NUEVA: da permiso para hacer git push

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Descargar lista completa
        run: |
          curl -o lista_completa.m3u https://iptv-org.github.io/iptv/countries/ar.m3u

      - name: Filtrar canales
        run: |
          echo "#EXTM3U" > lista_filtrada.m3u
          while IFS= read -r canal; do
            grep -i -A1 "$canal" lista_completa.m3u >> lista_filtrada.m3u || echo "# $canal no encontrado" >> lista_filtrada.m3u
          done < canales.txt

      - name: Subir archivo filtrado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lista_filtrada.m3u
          git commit -m "Actualizar lista filtrada" || echo "Sin cambios"
          git push
