name: Filtrar y verificar lista M3U

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar script
        run: |
          python filter.py

      - name: Subir archivo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lista_filtrada.m3u
          git commit -m "Actualizar lista filtrada" || echo "Sin cambios"
          git push
